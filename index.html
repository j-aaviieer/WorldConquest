function ringD(r){let s='',px=0;r.forEach((p,i)=>{s+=(i&&Math.abs(p[0]-px)<VW/2?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);px=p[0]});return s+'Z'}

function start(y,pi){const E=ERAS[y];G={y,e:E,day:0,date:new Date(y,0,1),n:0,D:[],cs:polities(y),w:{}};const own=[];
G.cs.forEach(c=>{c.m.forEach(i=>own[i]=c.ix);Object.assign(c,{pp:50,res:new Set,war:new Set,cur:null,prog:0,q:[],alive:1,pc:0,cc:c.m[0]});
c.inc=.3+Math.sqrt(c.eff)/100;c.mg=20+c.pop/40000;c.mon=c.inc*40;c.man=Math.max(1500,c.pop*.004);
c.tl=[...TECH,...(U[c.id]||pool(c.id)).map((u,k)=>[c.id+k,u[0],'★ Especial',k,k?[c.id+(k-1)]:[],u[1],70+k*50])];
TECH.forEach(t=>{if(t[3]<E.t)c.res.add(t[0])});c.tpls=JSON.parse(JSON.stringify(defTpls(E.t)));recalc(c)});
P.forEach(p=>p.own=own[p.c]);
G.cs.forEach(c=>{const f=FE[c.cc];let b=-1,bd=1e9;P.forEach((p,i)=>{if(p.c==c.cc){const d=(p.x-f.cx)**2+(p.y-f.cy)**2;if(d<bd){bd=d;b=i}}});c.cap=b});
count();
G.cs.forEach(c=>{c.start=c.pc;const mine=P.map((p,i)=>i).filter(i=>P[i].own==c.ix),n=Math.max(1,Math.min(45,Math.round(Math.sqrt(c.pop/1e6)*(y==2026?.9:1.1))));
for(let k=0;k<n;k++)spawn(c,k&&R()<.4&&ok(c,c.tpls[1])?1:0,k?mine[0|R()*mine.length]:c.cap)});
me=G.cs[pi];$('#menu').style.display='none';paint();sel=me.cap;selUpdate();log('Comienza la partida: '+E.n+'. Usa ▸ para avanzar el tiempo.');fit();zoomTo(P[sel],3);ui();draw()}
function spawn(c,t,p){const s=stats(c,c.tpls[t]);G.D.push({id:++G.n,o:c.ix,p,hp:s.hp,org:s.org,st:s,tn:c.tpls[t].name,ti:t,path:[],l:0,f:0})}
function train(c,t){const T=c.tpls[t],s=stats(c,T);if(!ok(c,T)||c.man<s.man||c.mon<s.mon)return 0;c.man-=s.man;c.mon-=s.mon;c.q.push({t,l:25});return 1}
function count(){G.cs.forEach(c=>{c.pc=0;c.lx=0;c.ly=0;c.ln=0});
P.forEach(p=>{const c=G.cs[p.own];c.pc++;if(p.c==c.cc){c.lx+=p.x;c.ly+=p.y;c.ln++}});
G.cs.forEach(c=>{if(c.alive&&c.pc&&!c.ln)P.forEach(p=>{if(p.own==c.ix){c.lx+=p.x;c.ly+=p.y;c.ln++}});
if(c.alive&&!c.pc){c.alive=0;G.D=G.D.filter(d=>d.o!=c.ix);G.cs.forEach(o=>o.war.delete(c.ix));c.war.clear();log('☠ '+c.name+' ha sido eliminado');if(c==me){alert('Has sido eliminado. Fin de la partida.');setSpeed(0)}}})}
function neighbors(c){const s=new Set;P.forEach(p=>{if(p.own==c.ix)p.nb.forEach(v=>{const o=P[v].own;if(o!=c.ix&&G.cs[o].alive)s.add(o)})});return[...s]}
function declare(a,b){if(a.war.has(b.ix))return;a.war.add(b.ix);b.war.add(a.ix);G.w[a.ix+'_'+b.ix]=G.w[b.ix+'_'+a.ix]=G.day;log('⚔ '+a.name+' declara la guerra a '+b.name)}
function peace(a,b){a.war.delete(b.ix);b.war.delete(a.ix);G.D.forEach(d=>{const o=P[d.p].own;if(o!=d.o&&(o==a.ix||o==b.ix)&&!G.cs[d.o].war.has(o)){const c=G.cs[d.o];d.p=P[c.cap].own==c.ix?c.cap:P.findIndex(p=>p.own==c.ix);d.path=[]}});log('🕊 Paz entre '+a.name+' y '+b.name)}
function bfs(s,goal,can){const pr=new Map([[s,-1]]),q=[s];for(let i=0;i<q.length;i++){const u=q[i];if(i&&goal(u)){const r=[];for(let x=u;x!=s;x=pr.get(x))r.unshift(x);return r}for(const v of P[u].nb)if(!pr.has(v)&&can(v)){pr.set(v,u);q.push(v)}}return null}
function ai(c){const g=G.day;
if(g%4==0&&c.q.length<3){const k=c.tpls.map((t,i)=>[i,stats(c,t)]).filter(a=>ok(c,c.tpls[a[0]])).sort((a,b)=>(b[1].atk+b[1].def)/b[1].mon-(a[1].atk+a[1].def)/a[1].mon)[0];if(k)train(c,k[0])}
if(!c.cur&&g%5==0){const a=avail(c).sort((x,y)=>x[6]-y[6]);if(a.length)c.cur=a[0][0]}
if(g%30==c.ix%30&&R()<.2&&!c.war.size&&G.D.some(d=>d.o==c.ix)){const dv=o=>G.D.filter(d=>d.o==o).length,n=neighbors(c).filter(o=>!c.war.has(o)&&dv(o)<dv(c.ix)*.9);if(n.length)declare(c,G.cs[n[0|R()*n.length]])}
if(c.war.size&&g%40==c.ix%40+1&&R()<.4){const e=[...c.war].filter(o=>G.cs[o]!=me)[0];if(e!=null)peace(c,G.cs[e])}
if(g%3==0&&c.war.size)G.D.filter(d=>d.o==c.ix&&!d.path.length&&!d.f&&R()<.6).forEach(d=>{const t=bfs(d.p,v=>c.war.has(P[v].own),v=>{const o=P[v].own;return o==c.ix||c.war.has(o)});if(t){d.path=t;d.l=dd(d)}})}
function move(){G.D.forEach(d=>{if(!d.path.length||d.f)return;if(--d.l>0)return;const n=d.path[0],o=P[n].own;if(o==d.o||G.cs[d.o].war.has(o)){d.p=n;d.path.shift();d.l=dd(d)}else d.path=[]})}
function combat(){const by={},dm=new Map;G.D.forEach(d=>{(by[d.p]=by[d.p]||[]).push(d);d.f=0});
for(const p in by){const Ls=by[p],ow=P[p].own;for(const a of Ls){const en=Ls.filter(b=>G.cs[a.o].war.has(b.o));if(!en.length)continue;a.f=1;const b=en[0|R()*en.length],bn=b.o==ow?1.2:1;dm.set(b,(dm.get(b)||0)+a.st.atk*(.5+R())*.25*100/(100+b.st.def*bn*.5))}}
for(const[d,x]of dm){d.org-=x;d.hp-=x*.5}
G.D=G.D.filter(d=>{if(d.hp<=0)return false;if(d.org<=0){const f=P[d.p].nb.filter(v=>P[v].own==d.o&&!G.D.some(e=>e.p==v&&G.cs[d.o].war.has(e.o)));if(!f.length)return false;d.p=f[0|R()*f.length];d.org=d.st.org*.3;d.path=[];d.f=0}return true})}
function occupy(){let ch=0;const by={};G.D.forEach(d=>(by[d.p]=by[d.p]||[]).push(d));
for(const p in by){const Ls=by[p],pr=P[p],ow=G.cs[pr.own];if(Ls.some(d=>d.o==pr.own))continue;const e=Ls.find(d=>ow.war.has(d.o));if(e){pr.own=e.o;ch=1;setOwn(+p);if(e.o==me.ix||ow==me)log(G.cs[e.o].name+' ocupa la provincia '+p+' de '+ow.name)}}return ch}
function tick(){G.day++;G.date.setDate(G.date.getDate()+1);
for(const c of G.cs){if(!c.alive)continue;const M=c.mod,up=G.D.filter(d=>d.o==c.ix).length;
c.mon=Math.max(0,c.mon+c.inc*(1+M.mon)-up*.12);c.man+=c.mg*(1+M.man);c.pp+=.4*(1+M.pp);
if(c.cur){c.prog+=(.6+Math.sqrt(c.pc)*.2)*(1+M.rp);const t=c.tl.find(x=>x[0]==c.cur);if(c.prog>=t[6]){c.res.add(c.cur);c.cur=null;c.prog=0;recalc(c);if(c==me)log('🔬 Investigación completada: '+t[1])}}
c.q.forEach(q=>q.l--);c.q=c.q.filter(q=>{if(q.l>0)return true;const p=P[c.cap].own==c.ix?c.cap:P.findIndex(x=>x.own==c.ix);if(p>=0)spawn(c,q.t,p);if(c==me)log('✔ División entrenada: '+c.tpls[q.t].name);return false});
if(c!=me)ai(c)}
move();combat();const ch=occupy();G.D.forEach(d=>{if(!d.f){d.org=Math.min(d.st.org,d.org+1);d.hp=Math.min(d.st.hp,d.hp+.3)}});
count();if(me.alive&&me.pc>P.length*.6){alert('¡VICTORIA! Dominas más del 60% del mapa.');setSpeed(0)}
ui();draw();if(tab&&G.day%3==0)win()}

mv.onwheel=e=>{e.preventDefault();const k=Math.max(.6,Math.min(45,K*(e.deltaY<0?1.2:1/1.2))),f=k/K;TX=e.clientX-(e.clientX-TX)*f;TY=e.clientY-(e.clientY-TY)*f;K=k;view()};
function order(t){if(sel<0||t<0||t==sel)return;const Ls=G.D.filter(d=>d.o==me.ix&&d.p==sel);if(!Ls.length)return;const can=v=>{const o=P[v].own;return o==me.ix||me.war.has(o)};
if(!can(t)){log('No puedes entrar: no estás en guerra con ese país');return}const pth=bfs(sel,v=>v==t,can);if(!pth){log('No hay ruta (¿mar de por medio?)');return}Ls.forEach(d=>{d.path=[...pth];d.l=dd(d)});draw()}
addEventListener('keydown',e=>{if(!G)return;const k=e.key.toLowerCase();if(k==' '){e.preventDefault();setSpeed(sp?0:2)}else if('12345'.includes(k)&&k)setSpeed(+k);else if(k=='a')openWin('army');else if(k=='t')openWin('tech');else if(k=='w')openWin('war');else if(k=='escape'){tab='';win()}});
addEventListener('resize',()=>{resize();if(!G)return;view()});
resize();loadWorld();
